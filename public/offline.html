<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Sem conexão · 30praum</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; margin: 0; }
      body {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #0a0a0a;
        color: #f5f5f5;
        font-family: ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
        text-align: center;
      }
      main { max-width: 360px; display: grid; gap: 20px; justify-items: center; }
      img { width: 96px; height: 96px; }
      h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
      p { color: #8a8a8a; line-height: 1.5; font-size: 15px; }
      button {
        margin-top: 4px;
        padding: 12px 24px;
        border: 1px solid rgba(255, 255, 255, 0.24);
        border-radius: 999px;
        background: transparent;
        color: #f5f5f5;
        font: inherit;
        font-size: 14px;
        cursor: pointer;
      }
      button:active { background: rgba(255, 255, 255, 0.08); }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="30praum" />
      <h1>Você está sem internet</h1>
      <p>As páginas que você já abriu continuam disponíveis. Assim que a conexão voltar, é só tentar de novo.</p>
      <button type="button" onclick="location.reload()">Tentar de novo</button>
    </main>
    <script>
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
